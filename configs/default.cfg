# ─────────────────────────────────────────────────────────────
#  Cache Simulator – Default Configuration
#  All sizes in bytes unless noted otherwise
# ─────────────────────────────────────────────────────────────

# ── L1 Cache (typically on-die, 4-8 cycles) ──────────────────
L1_SIZE    = 32768       # 32 KB
L1_ASSOC   = 4           # 4-way set associative
L1_BLOCK   = 64          # 64-byte cache lines (x86 standard)
L1_LATENCY = 4           # cycles

# ── L2 Cache ─────────────────────────────────────────────────
L2_SIZE    = 262144      # 256 KB
L2_ASSOC   = 8           # 8-way set associative
L2_BLOCK   = 64
L2_LATENCY = 12          # cycles

# ── Main Memory ──────────────────────────────────────────────
MEMORY_LATENCY = 100     # cycles (approx DRAM latency)

# ── Replacement Policy ───────────────────────────────────────
# Options: LRU | FIFO | RANDOM
POLICY = LRU

# ── Write Policy ─────────────────────────────────────────────
# Options: WRITE_BACK | WRITE_THROUGH
WRITE_POLICY = WRITE_BACK

# ── Write Allocate Policy ────────────────────────────────────
# Options: WRITE_ALLOCATE | NO_WRITE_ALLOCATE
ALLOC_POLICY = WRITE_ALLOCATE

# ── Special Modes ────────────────────────────────────────────
# BENCHMARK = TRUE   # Enables multithreaded benchmark mode
# COMPARE   = TRUE   # Compares all replacement policies
